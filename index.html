<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ef">
  <meta name="description"
    content="Choose Alphanumeric Innovations Pvt Ltd or Alphanumeric Engineering & Technologies LLP.">
  <meta property="og:title" content="Alphanumeric — Two companies. One vision.">
  <meta property="og:description" content="Discover your next possibility with Alphanumeric.">
  <meta property="og:type" content="website">
  <title>Alphanumeric — Choose Your Company</title>
  <link rel="icon"
    href="assets/images/favicon.svg"
    type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css">


</head>

<body>
  <div class="page-shell">
    <header class="site-header">
      <div class="brand" aria-label="Alphanumeric">
       
       
      </div>
     
    </header>

    <main>
      <section class="gateway" aria-labelledby="page-title">
       

        <div class="company-grid">
          <article class="company-card innovations" aria-labelledby="innovations-name">
            <div class="card-top"><span class="company-index">01</span><span class="card-category">THE SPIRIT OF
                INNOVATION</span><span class="card-dot" aria-hidden="true"></span></div>
            <div class="art-window" aria-hidden="true"><img class="company-art innovation-art"
                src="assets/images/innovation.svg"
                alt="" width="520" height="330"></div>
            <div class="company-info">
              <h2 id="innovations-name"><span class="company-prefix">Alphanumeric</span><span
                  class="company-name">Innovations</span><span class="legal-name">Pvt Ltd</span></h2>
            </div>
            <div class="card-bottom">
              <button class="company-action" type="button" data-company="innovations"
                aria-label="Explore Alphanumeric Innovations Pvt Ltd" aria-haspopup="dialog">
                <span>Explore company</span>
                <span class="arrow-circle" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none">
                    <path d="M6 18 18 6M6 6h12v12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                      stroke-linejoin="round" />
                  </svg></span>
              </button>
            </div>
          </article>

          <article class="company-card engineering" aria-labelledby="engineering-name">
            <div class="card-top"><span class="company-index">02</span><span class="card-category">THE PRECISION OF
                ENGINEERING</span><span class="card-dot" aria-hidden="true"></span></div>
            <div class="art-window" aria-hidden="true"><img class="company-art engineering-art"
                src="assets/images/engineering.svg"
                alt="" width="520" height="330"></div>
            <div class="company-info">
              <h2 id="engineering-name"><span class="company-prefix">Alphanumeric</span><span
                  class="company-name">Engineering &amp;<br>Technologies</span><span class="legal-name">LLP</span></h2>
            </div>
            <div class="card-bottom">
              <button class="company-action" type="button" data-company="engineering"
                aria-label="Explore Alphanumeric Engineering & Technologies LLP" aria-haspopup="dialog">
                <span>Explore company</span>
                <span class="arrow-circle" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none">
                    <path d="M6 18 18 6M6 6h12v12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                      stroke-linejoin="round" />
                  </svg></span>
              </button>
            </div>
          </article>
        </div>
      </section>
    </main>

  </div>


  <script src="assets/js/company-links.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>


</html>
